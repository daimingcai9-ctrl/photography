    <path d="M500,260 L520,255 L545,258 L558,272 L555,292 L542,308 L525,315 L508,310 L495,300 L492,282 L496,268Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <circle cx="530" cy="292" r="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- Guangxi -->
    <path d="M445,275 L465,268 L492,268 L500,282 L498,302 L485,312 L468,315 L450,308 L440,295Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Guizhou -->
    <path d="M445,240 L465,238 L480,245 L490,258 L488,272 L472,280 L455,278 L440,268 L438,252Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Yunnan -->
    <path d="M370,250 L390,248 L415,252 L445,260 L442,275 L430,285 L410,290 L390,288 L370,280 L360,268Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Sichuan + Chongqing -->
    <path d="M340,170 L370,165 L400,170 L430,180 L445,200 L448,225 L440,248 L425,250 L400,242 L375,235 L355,225 L335,210 L330,190Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <circle cx="405" cy="220" r="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- Shaanxi -->
    <path d="M415,140 L440,135 L455,148 L462,160 L445,175 L420,178 L395,175 L380,168 L378,152 L395,145Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Ningxia -->
    <path d="M395,130 L415,135 L420,148 L410,155 L392,150 L382,142Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>

    <!-- Taiwan -->
    <ellipse cx="615" cy="345" rx="4" ry="14" transform="rotate(-15 615 345)" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <!-- Hainan -->
    <ellipse cx="475" cy="365" rx="10" ry="8" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

    <!-- South China Sea inset -->
    <rect x="620" y="520" width="160" height="160" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <g transform="translate(660, 540) scale(0.25)">
      <path d="M50,30 L150,20 L170,55 L175,95 L140,120 L115,125 L90,118 L45,90 L38,50Z" stroke="rgba(255,255,255,0.2)" fill="rgba(255,255,255,0.02)"/>
      <ellipse cx="140" cy="200" rx="10" ry="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.2)"/>
      <ellipse cx="90" cy="220" rx="10" ry="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.2)"/>
    </g>

    <!-- Compass -->
    <g transform="translate(725, 30)">
      <circle cx="0" cy="0" r="22" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="0" y="-6" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="9" font-family="system-ui">N</text>
      <polygon points="0,-12 -3,-2 3,-2" fill="rgba(255,255,255,0.5)"/>
      <polygon points="0,12 -3,2 3,2" fill="rgba(255,255,255,0.2)"/>
    </g>
  </g>
</svg>
