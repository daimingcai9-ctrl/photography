    <circle cx="565" cy="172" r="3" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- Anhui -->
    <path d="M520,162 L535,170 L545,178 L540,190 L525,195 L510,190 L500,178 L505,170Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Hubei -->
    <path d="M490,175 L510,178 L525,190 L525,205 L510,215 L492,212 L480,200 L478,188Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Hunan -->
    <path d="M480,200 L510,205 L530,215 L535,232 L520,245 L500,248 L480,240 L470,225 L472,210Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Jiangxi -->
    <path d="M540,200 L555,208 L568,220 L570,238 L558,248 L540,245 L532,235 L535,218Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Zhejiang -->
    <path d="M575,190 L590,200 L598,218 L592,235 L578,240 L565,232 L558,220 L570,205Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Fujian -->
    <path d="M558,248 L575,255 L582,272 L575,288 L560,292 L548,285 L545,270 L552,255Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
