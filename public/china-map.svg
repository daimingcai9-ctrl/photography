    <!-- Henan -->
    <path d="M470,150 L490,148 L510,140 L525,150 L520,162 L505,172 L490,175 L472,170 L462,160Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
