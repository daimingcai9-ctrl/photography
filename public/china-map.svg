<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1e2230"/>
      <stop offset="100%" style="stop-color:#0a0c14"/>
    </radialGradient>
  </defs>
  <rect width="800" height="700" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="0.5">
    <line x1="0" y1="175" x2="800" y2="175"/><line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="0" y1="525" x2="800" y2="525"/><line x1="600" y1="0" x2="600" y2="700"/>
  </g>

  <!-- Province outlines -->
  <g fill="none" stroke-width="1" transform="scale(0.9) translate(45, 40)">
    <!-- Xinjiang -->
    <path d="M50,30 L120,20 L150,35 L170,55 L180,70 L175,95 L160,110 L140,120 L115,125 L90,118 L65,105 L45,90 L35,70 L38,50Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Tibet -->
    <path d="M115,125 L140,120 L165,125 L185,135 L200,150 L195,170 L175,185 L150,190 L125,185 L105,170 L100,150 L105,135Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Qinghai -->
    <path d="M165,125 L200,118 L240,120 L270,125 L285,140 L280,155 L260,160 L235,155 L210,148 L185,135Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Gansu -->
    <path d="M240,120 L290,100 L320,95 L340,105 L335,120 L315,128 L285,130 L260,132 L240,125Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Inner Mongolia -->
    <path d="M290,100 L340,70 L380,55 L420,50 L460,48 L490,55 L510,65 L500,80 L475,88 L440,92 L400,98 L370,105 L340,105Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Northeast (Heilongjiang + Jilin + Liaoning) -->
    <path d="M460,48 L510,30 L540,25 L560,35 L570,50 L565,70 L555,85 L540,92 L520,88 L500,78 L480,72 L460,68Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <path d="M540,92 L555,100 L565,115 L560,130 L545,138 L525,135 L510,125 L515,108Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Hebei + Beijing + Tianjin -->
    <path d="M460,68 L490,72 L510,82 L520,100 L530,115 L525,130 L510,135 L490,128 L475,118 L460,108 L455,90Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <circle cx="498" cy="105" r="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <!-- Shanxi -->
    <path d="M460,108 L475,118 L490,128 L485,142 L470,150 L455,148 L440,140 L438,125Z" stroke="rgba(255,255,255,0.18)" fill="rgba(255,255,255,0.015)"/>
    <!-- Shandong -->
