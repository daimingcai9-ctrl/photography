name: Private Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        android-api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare persistent private signing key
        env:
          SIGNING_KEY: ${{ secrets.HHS_ANDROID_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Missing private APK signing secret'; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/offline-signing.p12"
          chmod 600 "$RUNNER_TEMP/offline-signing.p12"
      - name: Build signed offline APK and device tests
        env:
          HHS_KEYSTORE_FILE: ${{ runner.temp }}/offline-signing.p12
          HHS_SIGNING_PASSWORD: ${{ secrets.HHS_ANDROID_SIGNING_PASSWORD }}
        run: |
          node scripts/prepare-android-fixtures.mjs
          gradle -p android assembleRelease assembleDebug assembleDebugAndroidTest lintRelease --no-daemon
      - name: Enable KVM for the disposable test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Remove signing material from runner before emulator tests
        if: always()
        run: rm -f "$RUNNER_TEMP/offline-signing.p12"
      - name: Verify independent offline library on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android-api }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 1536 -camera-back none -camera-front none
          script: |
            adb shell wm size 1200x2670
            adb shell wm density 480
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            timeout 240s adb shell am instrument -w com.hhs.photography.offline.test/com.hhs.photography.OfflineInstrumentation | tee offline-test-results.txt
            adb logcat -d -s AndroidRuntime System.err ActivityTaskManager chromium AlbumUI > offline-device-log.txt
            grep -q 'OFFLINE_TESTS_OK' offline-test-results.txt
            adb pull /sdcard/Android/data/com.hhs.photography.offline/files/ ui-screenshots
            adb uninstall com.hhs.photography.offline.test
            adb uninstall com.hhs.photography.offline
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.hhs.photography.offline/com.hhs.photography.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/offline-gallery.png
            adb pull /sdcard/offline-gallery.png offline-gallery.png
      - name: Name installable APK
        run: cp android/app/build/outputs/apk/release/app-release.apk photography-offline.apk
      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics-${{ matrix.android-api }}
          path: |
            offline-test-results.txt
            offline-device-log.txt
            android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.android-api == 30 && 'photography-private-apk' || 'photography-private-apk-android35' }}
          path: |
            photography-offline.apk
            offline-test-results.txt
            offline-gallery.png
            ui-screenshots/
          retention-days: 30
